name: CI

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.10"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Check zero-dependency stdlib-only imports
        run: python scripts/check_stdlib_only.py

      - name: Run regression test suite
        env:
          SUPER_WORKBENCH_DATA_DIR: ${{ runner.temp }}/swb-data
        run: python -m unittest discover -s tests -v
